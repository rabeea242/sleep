<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة دورات النوم</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1b2340;--muted:#5d6785;--accent:#4f46e5;--accent-t:#fff;--line:#dde2f0;--good:#e6f6ec;--good-t:#14663a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1426;--card:#1a2038;--text:#e8ebf7;--muted:#9aa3c4;--accent:#8b85ff;--accent-t:#0f1426;--line:#2b3355;--good:#12301f;--good-t:#7be0a4}}
:root[data-theme="dark"]{--bg:#0f1426;--card:#1a2038;--text:#e8ebf7;--muted:#9aa3c4;--accent:#8b85ff;--accent-t:#0f1426;--line:#2b3355;--good:#12301f;--good-t:#7be0a4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.6}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px 6px;border-radius:9px;font:inherit;font-size:.9rem;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--text);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center}
input[type=time]{flex:1;font:inherit;font-size:1.5rem;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);text-align:center;min-width:0}
.btn{border:0;background:var(--accent);color:var(--accent-t);font:inherit;padding:12px 16px;border-radius:12px;cursor:pointer;font-weight:700}
.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.lat{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted)}
.lat input{flex:1}
.res{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.res b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.res small{display:block;color:var(--muted);font-size:.8rem}
.res.rec{background:var(--good);border-color:transparent}
.res.rec small,.tag{color:var(--good-t)}
.tag{font-size:.78rem;font-weight:700}
.note{color:var(--muted);font-size:.82rem}
</style>
</head>
<body>
<main>
<h1>😴 حاسبة دورات النوم</h1>
<p class="sub">كل دورة نوم ≈ ٩٠ دقيقة. الاستيقاظ في نهاية الدورة (نوم خفيف) يجعلك أنشط.</p>

<div class="tabs">
<button id="t1" class="on">أنام ← متى أضبط المنبه؟</button>
<button id="t2">أستيقظ ← متى أنام؟</button>
</div>

<div class="card">
<label id="lbl">وقت ذهابي إلى الفراش</label>
<div class="row">
<input type="time" id="tm" value="23:00">
<button class="btn sec" id="now">الآن</button>
</div>
<div class="lat">
<span>وقت النوم: <b id="lv">١٥</b> د</span>
<input type="range" id="lat" min="0" max="45" step="5" value="15">
</div>
<p class="note" style="margin:10px 0 0">وقت النوم: المدة التي تستغرقها عادةً حتى تنام بعد الاستلقاء.</p>
</div>

<div id="out"></div>
<p class="note">الأخضر = الأفضل (٥ أو ٦ دورات ≈ ٧٫٥–٩ ساعات). حاجة الأشخاص تختلف قليلًا، فاختر ما يناسبك.</p>
</main>

<script>
(function(){
var mode=1,CYC=90;
var fmt=new Intl.DateTimeFormat('ar-EG',{hour:'numeric',minute:'2-digit',hour12:true});
var tm=document.getElementById('tm'),lat=document.getElementById('lat'),out=document.getElementById('out');
function hm(m){var h=Math.floor(m/60),mi=m%60;return h+' ساعة'+(mi?' و'+mi+' دقيقة':'')}
function toDate(v,addMin){var p=v.split(':');var d=new Date(2000,0,1,+p[0],+p[1]+addMin,0);return d}
function render(){
 var l=+lat.value;document.getElementById('lv').textContent=l.toLocaleString('ar-EG');
 if(!tm.value){out.innerHTML='';return}
 var list=mode===1?[3,4,5,6]:[6,5,4,3],h='';
 if(mode===2){list=[6,5,4,3]}
 list.forEach(function(n){
  var total=n*CYC,t,rec=(n===5||n===6);
  if(mode===1){t=fmt.format(toDate(tm.value,l+total))}
  else{t=fmt.format(toDate(tm.value,-(l+total)))}
  h+='<div class="res'+(rec?' rec':'')+'"><div><b>'+t+'</b><small>'+n.toLocaleString('ar-EG')+' دورات · نوم '+hm(total)+'</small></div>'+(rec?'<span class="tag">موصى به</span>':'')+'</div>';
 });
 out.innerHTML=(mode===1?'<p class="note">اضبط المنبه على:</p>':'<p class="note">اذهب إلى الفراش في:</p>')+h;
}
function setMode(m){
 mode=m;
 document.getElementById('t1').className=m===1?'on':'';
 document.getElementById('t2').className=m===2?'on':'';
 document.getElementById('lbl').textContent=m===1?'وقت ذهابي إلى الفراش':'الوقت الذي أريد الاستيقاظ فيه';
 tm.value=m===1?'23:00':'06:00';
 render();
}
document.getElementById('t1').onclick=function(){setMode(1)};
document.getElementById('t2').onclick=function(){setMode(2)};
document.getElementById('now').onclick=function(){
 var d=new Date();tm.value=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);render();
};
tm.oninput=render;lat.oninput=render;
render();
})();
</script>
</body>
</html>
